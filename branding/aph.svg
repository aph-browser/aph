<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456">
  <!-- Aph mark: geometric spaces-grid (dock language) on the canvas base.
       2x2 grid, top-left filled, rest outline — workspace 1 is home.
       CANONICAL SOURCE: branding/aph.png, branding/aph-small.png and
       docs/aph.png are Pillow renders of this exact geometry
       (scripts/render_logo.py — keep GEOMETRY in sync; tests enforce it).
       Redrawn from the raster autotrace; keep the grid geometry if the
       brand evolves (dock mark in 65-dock.js is the same form). -->
  <rect width="456" height="456" rx="100" fill="#17181f"/>
  <rect x="84" y="84" width="120" height="120" rx="28" fill="#e8e8ec"/>
  <rect x="252" y="84" width="120" height="120" rx="28" fill="none" stroke="#e8e8ec" stroke-width="20"/>
  <rect x="84" y="252" width="120" height="120" rx="28" fill="none" stroke="#e8e8ec" stroke-width="20"/>
  <rect x="252" y="252" width="120" height="120" rx="28" fill="none" stroke="#e8e8ec" stroke-width="20"/>
</svg>
