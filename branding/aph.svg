<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456">
  <!-- Aph mark — a plain capital A in Inter Bold.
       Near-black tile (#0a0a0e) with a faint light hairline so the
       icon keeps a silhouette on dark chrome; letter flat Purple
       #8e4ec6 (no pretend gradient — one hue, full strength).
       Simple by design: one system voice, one hue, one tile.
       The A is a real glyph (Inter 700, branding/fonts/), not a
       hand-drawn polygon — hinting keeps the counter open at 16px,
       so all masters render the same construction.
       CANONICAL SOURCE: branding/aph.png, branding/aph-small.png and
       docs/aph.png are Pillow renders of this file with the same font
       (scripts/render_logo.py — keep GEOMETRY in sync; tests enforce it).
       NOTE: chrome SVGs don't get page @font-face, so in-browser the
       text falls back to system bold where Inter is absent — a system
       bold A centers the same via text-anchor, so the fallback is safe. -->
  <defs>
    <linearGradient id="aphTile" x1="0" y1="0" x2="0" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0e"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="aphA" x1="0" y1="78" x2="0" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8e4ec6"/>
      <stop offset="1" stop-color="#8e4ec6"/>
    </linearGradient>
  </defs>
  <rect width="456" height="456" rx="100" fill="url(#aphTile)"/>
  <rect x="1" y="1" width="454" height="454" rx="99" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2"/>
  <text x="228" y="238" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="336" font-weight="700" fill="url(#aphA)">A</text>
</svg>
