<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to Aph</title>
<link rel="stylesheet" href="chrome://browser/content/aph-welcome.css" />
<script src="chrome://browser/content/aph-welcome-page.js"></script>
</head>
<body>
<div id="aph-welcome">
  <header id="aph-welcome-head">
    <div id="aph-welcome-title">Welcome to Aph</div>
    <div id="aph-welcome-sub">A workspaces-first browser on stock Firefox. Three habits cover most of it.</div>
  </header>
  <main id="aph-welcome-list"></main>
  <footer id="aph-welcome-foot">
    <button id="aph-welcome-dismiss" type="button">Get started</button>
    <span id="aph-welcome-links">
      <a id="aph-welcome-open-settings" href="chrome://browser/content/aph-settings.html">Aph Settings</a>
      <span aria-hidden="true"> · </span>
      <a id="aph-welcome-open-archive" href="chrome://browser/content/aph-archive.html">Open Archive</a>
    </span>
  </footer>
</div>
</body>
</html>
