<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archive</title>
<link rel="stylesheet" href="chrome://browser/content/aph-archive.css" />
<script src="chrome://browser/content/archive-shared.js"></script>
<script src="chrome://browser/content/aph-archive-page.js"></script>
</head>
<body>
<div id="aph-archive">
  <header id="aph-archive-head">
    <div id="aph-archive-title">Archive <span id="aph-archive-count"></span></div>
    <input id="aph-archive-search" type="search" placeholder="Filter by title, domain, workspace…  ( / focuses, fuzzy)" autocomplete="off" spellcheck="false" aria-label="Filter archive" />
    <div id="aph-archive-tools">
      <div id="aph-archive-pills" role="tablist" aria-label="Workspace filter"></div>
      <div id="aph-archive-sortbar">
        <label id="aph-archive-sortlabel" for="aph-archive-sort">Sort</label>
        <select id="aph-archive-sort" aria-label="Sort archive">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="site">By site</option>
        </select>
        <span id="aph-archive-keep">Shift+Enter keeps a copy in the archive</span>
      </div>
      <div id="aph-archive-bulkbar" hidden>
        <span id="aph-archive-bulkcount"></span>
        <button id="aph-archive-bulk-restore" type="button">Restore selected</button>
        <button id="aph-archive-bulk-delete" type="button">Delete selected</button>
        <button id="aph-archive-bulk-clear" type="button">Clear</button>
      </div>
    </div>
  </header>
  <main id="aph-archive-list"></main>
  <div id="aph-archive-empty" hidden>No archived tabs yet. Archive one from the tab menu or the palette.</div>
  <div id="aph-archive-nobridge" hidden>Archive bridge unavailable — restores are disabled. Try reloading this page.</div>
  <div id="aph-archive-toast"></div>
</div>
</body>
</html>
