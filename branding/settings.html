<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aph Settings</title>
<link rel="stylesheet" href="chrome://browser/content/aph-settings.css" />
<script src="chrome://browser/content/aph-settings-page.js"></script>
</head>
<body>
<div id="aph-settings">
  <header id="aph-settings-head">
    <div id="aph-settings-title">Aph Settings</div>
    <div id="aph-settings-sub">Appearance, workspaces, stash, tabs and sidebar. Changes apply immediately and persist.</div>
    <input id="aph-settings-search" type="search" placeholder="Filter settings…  ( / focuses)" autocomplete="off" spellcheck="false" aria-label="Filter settings" />
  </header>
  <main id="aph-settings-list"></main>
  <footer id="aph-settings-foot">
    <span id="aph-settings-actions">
      <button id="aph-settings-export" type="button">Export backup</button>
      <button id="aph-settings-import" type="button">Import backup</button>
      <input id="aph-settings-import-file" type="file" accept="application/json,.json" hidden />
    </span>
    <button id="aph-settings-reset-frecency" type="button">Reset command frecency</button>
    <span id="aph-settings-links">
      <a id="aph-settings-open-stash" href="chrome://browser/content/aph-stash.html">Open Stash</a>
      <span aria-hidden="true"> · </span>
      <a id="aph-settings-advanced" href="about:config?filter=aph">Advanced (about:config)</a>
    </span>
  </footer>
  <div id="aph-settings-toast"></div>
  <div id="aph-settings-modal" hidden>
    <div id="aph-settings-modal-card" role="dialog" aria-modal="true" aria-labelledby="aph-settings-modal-title">
      <div id="aph-settings-modal-title"></div>
      <div id="aph-settings-modal-desc"></div>
      <div id="aph-settings-modal-actions">
        <button id="aph-settings-modal-cancel" type="button">Cancel</button>
        <button id="aph-settings-modal-ok" type="button">Confirm</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
