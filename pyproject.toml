[project]
name = "aph"
version = "0.1.0"
description = "Aph Browser — Firefox-based browser with native overrides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11"]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.uv]
managed = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
python_files = ["test_*.py"]
