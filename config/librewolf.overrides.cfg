// Aph Browser Custom Overrides

// 1. Usability / Timezone / Dark mode
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.clearOnShutdown.cookies", false);

// 2. DRM Playback (Netflix / Spotify)
defaultPref("media.eme.enabled", true);
defaultPref("media.gmp-widevinecdm.enabled", true);
defaultPref("media.gmp-provider.enabled", true);

// 3. Force Vertical Tabs
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.visibility", "always-show");

// 4. Disable pre-rendered New Tab cache during development (smoking gun fix)
defaultPref("browser.startup.homepage.abouthome_cache.enabled", false);
