name: Build Linux packages

# Private cloud builds: manual "Run workflow" button or push to main.
# The AppImage, the Flatpak single-file bundle, and the Windows portable
# folder are uploaded as Action artifacts (auto-deleted after retention-days).
# Public releases are built by release.yml on `v*` tags.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow ruff pytest

      - name: Ruff lint
        run: ruff check scripts/ tests_py/

      - name: Ruff format check
        run: ruff format --check scripts/ tests_py/

      - name: Generated bundles are fresh
        run: python scripts/build_assets.py --check

      - name: Python unit tests
        run: python -m pytest tests_py/ -q

      - name: Node harness tests
        run: node --test "tests/*.test.js"

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run harness tests
        run: node --test "tests/*.test.js"

      - name: Install Python deps
        run: pip install pillow

      - name: Install AppImage tooling
        run: sudo apt-get update && sudo apt-get install -y libfuse2 zsync

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Prepare Aph build
        run: |
          python scripts/fetch.py
          python scripts/update_prefs.py
          python scripts/rebrand.py
          python -c "import sys; sys.path.insert(0, '.'); from scripts.dev import merge_policies; from pathlib import Path; merge_policies(Path('.').resolve())"

      - name: Assemble AppDir
        run: |
          mkdir -p build/AppDir/usr/bin build/AppDir/usr/share/aph build/AppDir/usr/share/icons/hicolor/128x128/apps
          cp -r build/firefox/. build/AppDir/usr/bin/
          cp config/user.js build/AppDir/usr/share/aph/user.js
          cp branding/userChrome.css build/AppDir/usr/share/aph/userChrome.css
          cp branding/aph.png build/AppDir/aph.png
          cp branding/aph.png build/AppDir/usr/share/icons/hicolor/128x128/apps/aph.png
          cp packaging/aph.desktop build/AppDir/aph.desktop
          cp packaging/AppRun build/AppDir/AppRun
          chmod +x build/AppDir/AppRun

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          ./appimagetool build/AppDir aph-x86_64.AppImage

      - name: Smoke test
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./aph-x86_64.AppImage --version

      - name: Upload AppImage as private artifact
        uses: actions/upload-artifact@v6
        with:
          name: aph-x86_64
          path: aph-x86_64.AppImage
          retention-days: 7

  flatpak:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow

      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: flatpak install -y --user flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Prepare Aph build
        run: |
          python scripts/fetch.py
          python scripts/update_prefs.py
          python scripts/rebrand.py
          python -c "import sys; sys.path.insert(0, '.'); from scripts.dev import merge_policies; from pathlib import Path; merge_policies(Path('.').resolve())"

      - name: Stage Flatpak sources
        run: |
          mkdir -p build/flatpak-stage
          cp -a build/firefox build/flatpak-stage/firefox
          cp config/user.js build/flatpak-stage/user.js
          cp branding/userChrome.css build/flatpak-stage/userChrome.css
          cp packaging/flatpak/aph build/flatpak-stage/aph
          cp "packaging/flatpak/io.github.aph_browser.Aph.desktop" build/flatpak-stage/
          cp "packaging/flatpak/io.github.aph_browser.Aph.metainfo.xml" build/flatpak-stage/
          cp branding/aph.png build/flatpak-stage/aph.png

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak-build packaging/flatpak/io.github.aph_browser.Aph.yml

      - name: Smoke test
        run: |
          flatpak-builder --run build/flatpak-build packaging/flatpak/io.github.aph_browser.Aph.yml aph --version

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle build/flatpak-repo aph-x86_64.flatpak io.github.aph_browser.Aph --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak as private artifact
        uses: actions/upload-artifact@v6
        with:
          name: aph-flatpak-x86_64
          path: aph-x86_64.flatpak
          retention-days: 7

  windows:
    runs-on: windows-latest
    needs: lint
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow

      - name: Prepare Aph build
        run: |
          python scripts/fetch.py
          python scripts/update_prefs.py
          python scripts/rebrand.py
          python -c "import sys; sys.path.insert(0, '.'); from scripts.dev import merge_policies; from pathlib import Path; merge_policies(Path('.').resolve())"

      - name: Stage portable layout
        run: |
          mkdir -p build/win-portable/config
          cp -a build/firefox build/win-portable/firefox
          cp config/user.js build/win-portable/config/user.js
          cp branding/userChrome.css build/win-portable/config/userChrome.css
          cp packaging/aph.bat build/win-portable/aph.bat

      - name: Smoke test
        run: |
          test -f build/win-portable/firefox/firefox.exe
          test -f build/win-portable/firefox/browser/omni.ja
          test -f build/win-portable/aph.bat
          python -c "import sys; sys.exit(0 if open('build/win-portable/firefox/browser/omni.ja','rb').read().find(b'Aph') != -1 else 1)"

      - name: Build installer
        run: |
          if ! command -v ISCC >/dev/null 2>&1; then choco install innosetup -y --no-progress; fi
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          python -c "from PIL import Image; Image.open('branding/aph.png').save('packaging/aph.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          # git-bash (MSYS2) rewrites leading-slash args as POSIX paths, which
          # would mangle ISCC's /D flag into a second "script filename".
          export MSYS2_ARG_CONV_EXCL="*"
          ISCC "/DVersion=$VER" packaging/aph.iss
          ls packaging/Output/

      - name: Smoke test installer
        # MSYS2_ARG_CONV_EXCL again: /DIR= starts with /D and would be
        # mangled the same way /DVersion was. /VERYSILENT + /SUPPRESSMSGBOXES
        # so a bad path can never block on a dialog (that hang is what the
        # 2-hour run was). `timeout` is the backstop.
        run: |
          export MSYS2_ARG_CONV_EXCL="*"
          EXE=(packaging/Output/Aph-Setup-*.exe)
          timeout 600 "$EXE" /VERYSILENT /SUPPRESSMSGBOXES /DIR="C:\aph-inst-test"
          test -f "/c/aph-inst-test/aph.bat"
          test -f "/c/aph-inst-test/firefox/firefox.exe"
          timeout 600 "/c/aph-inst-test/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES
          test ! -f "/c/aph-inst-test/aph.bat"

      - name: Upload Windows portable as private artifact
        uses: actions/upload-artifact@v6
        with:
          name: aph-win64-portable
          path: build/win-portable/
          retention-days: 7

      - name: Upload Windows installer as private artifact
        uses: actions/upload-artifact@v6
        with:
          name: aph-win64-setup
          path: packaging/Output/Aph-Setup-*.exe
          retention-days: 7
