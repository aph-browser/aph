name: Sync site (aph-browser.github.io)

# The website is authored here in docs/ and mirrored to the org site repo,
# which GitHub Pages serves at https://aph-browser.github.io/. The site
# repo holds no unique content — every push here overwrites it.
#
# One-time setup:
#   1. Create an EMPTY repo named aph-browser/aph-browser.github.io
#      (no README/license — it must start branchless).
#   2. This repo → Settings → Secrets → Actions → SITE_DEPLOY_TOKEN:
#      a PAT (classic, `repo` scope) that can push to the site repo.
#   3. Site repo → Settings → Pages → Deploy from a branch → main, / (root).
on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/sync-site.yml"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Skipped until SITE_DEPLOY_TOKEN is set (one-time setup above) —
      # keeps the run green before the site repo exists. (The `secrets`
      # context is only readable inside steps, hence the gate lives here
      # instead of a job-level `if`.)
      - name: Check for deploy token
        id: gate
        run: |
          if [ -z "${SITE_TOKEN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}

      - name: Push docs/ to site repo
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -eu
          export GIT_TERMINAL_PROMPT=0
          rm -rf /tmp/site
          mkdir -p /tmp/site
          cd /tmp/site
          git init -q -b main
          git rev-parse --is-inside-work-tree
          git config user.name "aph-site-sync"
          git config user.email "aph-site-sync@users.noreply.github.com"
          git remote add origin "https://x-access-token:${SITE_TOKEN}@github.com/aph-browser/aph-browser.github.io.git"
          # Empty repo: nothing to fetch yet; otherwise resume its history
          # so the mirror keeps a sane log.
          if git fetch origin main 2>/dev/null; then
            git reset --hard FETCH_HEAD
          fi
          rsync -a --delete --exclude='.git/' --exclude='CNAME' "$GITHUB_WORKSPACE/docs/" /tmp/site/
          git add -A
          if git status --porcelain | grep -q .; then
            git commit -m "Sync from aph-browser/aph@${GITHUB_SHA:0:7}"
            # Force: the site repo is a pure generated mirror with this
            # workflow as its only writer, so there is nothing to merge.
            git push --force origin HEAD:main
          else
            echo "No site changes."
          fi
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
