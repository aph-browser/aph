name: Mirror to GitLab

# Code resilience mirror: pushes all branches + tags to gitlab.com/aph-browser/aph
# (GitLab project ID 86313667). Binaries are NOT mirrored here — that comes
# with the public-release workflow (GitLab Generic Packages + Releases).
# Setup: GitHub repo Settings → Secrets → Actions → GITLAB_TOKEN (Legacy
# token with `api` + `write_repository`). Never commit the token itself.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    # Dependabot branch pushes never need mirroring — their content lands
    # on the mirror when the PR merges to main. Skipping keeps dep PRs
    # from carrying a red, meaningless Mirror check.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        # Push from remote-tracking refs, not local branches: on tag events
        # the checkout is detached with no local branches, so `push --all`
        # would try to *delete* the mirror's main (GitLab rejects that).
        # Pushing refs/remotes/origin/* is correct on every event type.
        run: |
          set -eu
          git fetch --prune --prune-tags origin
          git remote set-head origin -d
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/aph-browser/aph.git"
          git push gitlab --force --prune '+refs/remotes/origin/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
