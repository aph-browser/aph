name: Release (tag)

# First public releases: push a `v*` tag and this builds all three
# platforms in-run, then publishes a GitHub release with
# aph-x86_64.AppImage, aph-x86_64.flatpak, aph-win64-portable.zip and
# SHA256SUMS. Binaries never cross workflow runs (download-artifact is
# run-scoped), so the build and the publish live in this one workflow.
# Re-running a tag reuses the same assets; delete the release first if
# you need to re-publish it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow ruff pytest

      - name: Ruff lint
        run: ruff check scripts/ tests_py/

      - name: Ruff format check
        run: ruff format --check scripts/ tests_py/

      - name: Generated bundles are fresh
        run: python scripts/build_assets.py --check

      - name: Python unit tests
        run: python -m pytest tests_py/ -q

      - name: Node harness tests
        run: node --test "tests/*.test.js"

  appimage:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run harness tests
        run: node --test "tests/*.test.js"

      - name: Install Python deps
        run: pip install pillow

      - name: Install AppImage tooling
        run: sudo apt-get update && sudo apt-get install -y libfuse2 zsync

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Prepare Aph build
        run: |
          python scripts/fetch.py
          python scripts/update_prefs.py
          python scripts/rebrand.py
          python -c "import sys; sys.path.insert(0, '.'); from scripts.dev import merge_policies; from pathlib import Path; merge_policies(Path('.').resolve())"

      - name: Record Firefox base version
        run: grep '^Version=' build/firefox/application.ini | cut -d= -f2 | tr -d '[:space:]' > firefox-version.txt

      - name: Assemble AppDir
        run: |
          mkdir -p build/AppDir/usr/bin build/AppDir/usr/share/aph build/AppDir/usr/share/icons/hicolor/128x128/apps
          cp -r build/firefox/. build/AppDir/usr/bin/
          cp config/user.js build/AppDir/usr/share/aph/user.js
          cp branding/userChrome.css build/AppDir/usr/share/aph/userChrome.css
          cp branding/userContent.css build/AppDir/usr/share/aph/userContent.css
          cp packaging/seed-profile.sh build/AppDir/usr/share/aph/seed-profile.sh
          chmod +x build/AppDir/usr/share/aph/seed-profile.sh
          cp branding/aph.png build/AppDir/aph.png
          cp branding/aph.png build/AppDir/usr/share/icons/hicolor/128x128/apps/aph.png
          python -c "from PIL import Image; im=Image.open('branding/aph.png').convert('RGBA'); import os; [(os.makedirs(f'build/AppDir/usr/share/icons/hicolor/{s}x{s}/apps', exist_ok=True), im.resize((s,s), Image.LANCZOS).save(f'build/AppDir/usr/share/icons/hicolor/{s}x{s}/apps/aph.png')) for s in (16,32,48,64,256)]"
          cp packaging/aph.desktop build/AppDir/aph.desktop
          cp packaging/AppRun build/AppDir/AppRun
          chmod +x build/AppDir/AppRun

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          ./appimagetool build/AppDir aph-x86_64.AppImage

      - name: Smoke test
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./aph-x86_64.AppImage --version

      - name: Hand off to publish
        uses: actions/upload-artifact@v7
        with:
          name: rel-appimage
          path: aph-x86_64.AppImage
          retention-days: 1

      - name: Hand off base version
        uses: actions/upload-artifact@v7
        with:
          name: rel-meta
          path: firefox-version.txt
          retention-days: 1

      - name: Build update payload
        run: |
          python scripts/build_payload.py --out build/payload-out
          ls build/payload-out/

      - name: Hand off payload to publish
        uses: actions/upload-artifact@v7
        with:
          name: rel-payload
          path: build/payload-out/
          retention-days: 1

  flatpak:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow

      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: flatpak install -y --user flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Prepare Aph build
        run: |
          python scripts/fetch.py
          python scripts/update_prefs.py
          python scripts/rebrand.py
          python -c "import sys; sys.path.insert(0, '.'); from scripts.dev import merge_policies; from pathlib import Path; merge_policies(Path('.').resolve())"

      - name: Stage Flatpak sources
        run: |
          mkdir -p build/flatpak-stage
          cp -a build/firefox build/flatpak-stage/firefox
          cp config/user.js build/flatpak-stage/user.js
          cp branding/userChrome.css build/flatpak-stage/userChrome.css
          cp branding/userContent.css build/flatpak-stage/userContent.css
          cp packaging/seed-profile.sh build/flatpak-stage/seed-profile.sh
          cp packaging/flatpak/aph build/flatpak-stage/aph
          cp "packaging/flatpak/io.github.aph_browser.Aph.desktop" build/flatpak-stage/
          cp "packaging/flatpak/io.github.aph_browser.Aph.metainfo.xml" build/flatpak-stage/
          cp branding/aph.png build/flatpak-stage/aph.png
          python -c "from PIL import Image; im=Image.open('branding/aph.png').convert('RGBA'); import os; [(os.makedirs(f'build/flatpak-stage/icons/hicolor/{s}x{s}/apps', exist_ok=True), im.resize((s,s), Image.LANCZOS).save(f'build/flatpak-stage/icons/hicolor/{s}x{s}/apps/io.github.aph_browser.Aph.png')) for s in (16,32,48,64,128,256)]"

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak-build packaging/flatpak/io.github.aph_browser.Aph.yml

      - name: Smoke test
        run: |
          flatpak-builder --run build/flatpak-build packaging/flatpak/io.github.aph_browser.Aph.yml aph --version

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle build/flatpak-repo aph-x86_64.flatpak io.github.aph_browser.Aph --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Hand off to publish
        uses: actions/upload-artifact@v7
        with:
          name: rel-flatpak
          path: aph-x86_64.flatpak
          retention-days: 1

  windows:
    runs-on: windows-latest
    needs: lint
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow

      - name: Prepare Aph build
        run: |
          python scripts/fetch.py
          python scripts/update_prefs.py
          python scripts/rebrand.py
          python -c "import sys; sys.path.insert(0, '.'); from scripts.dev import merge_policies; from pathlib import Path; merge_policies(Path('.').resolve())"

      - name: Stage portable layout
        run: |
          mkdir -p build/win-portable/config
          cp -a build/firefox build/win-portable/firefox
          cp config/user.js build/win-portable/config/user.js
          cp branding/userChrome.css build/win-portable/config/userChrome.css
          cp branding/userContent.css build/win-portable/config/userContent.css
          cp packaging/aph.bat build/win-portable/aph.bat
          cp packaging/aph-update.ps1 build/win-portable/aph-update.ps1

      - name: Smoke test
        run: |
          test -f build/win-portable/firefox/firefox.exe
          test -f build/win-portable/firefox/browser/omni.ja
          test -f build/win-portable/aph.bat
          python -c "import sys; sys.exit(0 if open('build/win-portable/firefox/browser/omni.ja','rb').read().find(b'Aph') != -1 else 1)"

      - name: Build installer
        run: |
          if ! command -v ISCC >/dev/null 2>&1; then choco install innosetup -y --no-progress; fi
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          python -c "from PIL import Image; Image.open('branding/aph.png').save('packaging/aph.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          VER="${GITHUB_REF#refs/tags/}"
          VER="${VER#v}"
          # git-bash (MSYS2) rewrites leading-slash args as POSIX paths, which
          # would mangle ISCC's /D flag into a second "script filename".
          export MSYS2_ARG_CONV_EXCL="*"
          ISCC "/DVersion=$VER" packaging/aph.iss
          ls packaging/Output/

      - name: Hand off to publish
        uses: actions/upload-artifact@v7
        with:
          name: rel-winportable
          path: build/win-portable/
          retention-days: 1

      - name: Hand off installer to publish
        uses: actions/upload-artifact@v7
        with:
          name: rel-wininstaller
          path: packaging/Output/Aph-Setup-*.exe
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [appimage, flatpak, windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Collect handoffs
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Stage release assets
        run: |
          set -eu
          mkdir -p release
          cp dist/rel-appimage/aph-x86_64.AppImage release/
          cp dist/rel-flatpak/aph-x86_64.flatpak release/
          cp dist/rel-wininstaller/Aph-Setup-*.exe release/
          cp dist/rel-payload/aph-payload-*.zip dist/rel-payload/version.json release/
          python -c "import shutil; shutil.make_archive('release/aph-win64-portable', 'zip', root_dir='dist/rel-winportable')"
          (cd release && sha256sum aph-x86_64.AppImage aph-x86_64.flatpak aph-win64-portable.zip Aph-Setup-*.exe aph-payload-*.zip version.json > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Write release notes
        # Quoted heredoc + sed tokens: an unquoted heredoc would execute the
        # backticked snippets (chmod, paths) as shell commands and fail.
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          PKGVER="$(python -c "from scripts.version import get_version; print(get_version())")"
          if [ "$VER" != "$PKGVER" ]; then
            echo "Tag $TAG does not match pyproject.toml version $PKGVER" >&2
            exit 1
          fi
          FXVER="$(cat dist/rel-meta/firefox-version.txt)"
          cat > notes.md <<'EOF'
           ## Aph __VER__

           Unsigned builds; full upgrades stay manual re-downloads.
           Windows installs self-update the Aph payload on launch
           (branding only, verified — opt out with APH_NO_UPDATE=1);
           new Firefox bases still ship as installers.

           - Aph version: __VER__
           - Firefox base: __FXVER__ (recorded from application.ini at build time)
           - Profiles: Linux `~/.config/aph/profile` (daily install) ·
              Windows `%APPDATA%\Aph\profile` (seed-once user.js + userChrome.css + userContent.css)

           ### What's new in __VER__

           Stash (was Archive)
           - Renamed across UI, prefs (`aph.stash.*`), and pages
             (`aph-stash.html`); existing stashes migrate
             automatically and old keys are cleared.
           - Workspace snapshots: periodic + safety auto-stash of
             changed workspaces, with cadence and bulk-close
             threshold in Settings under Stash.
           - Stash search stays fuzzy with workspace + container
             restore and staleness control.

           Split view & focus mode
           - Split view (`Ctrl+Alt+\` or palette): native
             side-by-side panes with the most-recently-viewed
             same-workspace tab; switching workspaces separates
             the pair, both tabs stay open.
           - Focus mode (`Ctrl+Alt+F` or palette): hides all
             chrome and leaves only the page; session-only and
             per-window, palette stays reachable.

           Workspaces & settings
           - Per-workspace accent overrides (16 hues) alongside
             names, tags, and Lucide icons.
           - Switch keeps the staggered arrival plus the
             directional rim-bloom glide and respects
             reduced-motion.
           - Auto-unload is on by default and workspace-agnostic;
             Settings gains Accounts & Passwords toggles (off by
             default) and persists through profile/user.js.
           - Sync and the password manager are re-enabled;
             removed policies are pruned via last-applied
             snapshot; single POSIX seed-once implementation.

           Upstream robustness
           - Drift detector pins every stock selector/token/pref Aph
             depends on against the packaged Firefox (fails loud on
             upstream removal).
           - Firefox base stays at 157.0 (current at release time,
             recorded from application.ini during the build).

           ### Heads-up upgrading from 0.3.x

           - Drop-in re-download: no profile move, no shortcut
             changes. Stash migration is automatic.
           - Removed: the extension first-run silencer
             (`aph.addons.silenceFirstRun`) — extension welcome
             tabs will open again.
           - For the 0.2.x notes, see the 0.3.0 release; for the
             0.1.x notes (profile move, `Alt+1..9` shortcut,
             tree-style tabs removal), see the 0.2.0 release.

           ### Install

          - Linux AppImage: `chmod +x aph-x86_64.AppImage && ./aph-x86_64.AppImage`
          - Linux Flatpak: `flatpak install aph-x86_64.flatpak`
          - Windows: run `Aph-Setup-*.exe` (per-user, no admin needed), or
            extract `aph-win64-portable.zip` anywhere and run `aph.bat`

          ### Verify

          ```sh
          sha256sum -c SHA256SUMS
          ```

           ### Known limitations

           - Unsigned binaries: Windows SmartScreen warns on first launch (expected).
           - Payload auto-update covers Windows only so far (Linux/macOS formats stay manual).
           - See README for details and [SECURITY.md](https://github.com/aph-browser/aph/blob/main/SECURITY.md) to report vulnerabilities.
          EOF
          sed -i "s/__VER__/${VER}/g; s/__FXVER__/${FXVER}/g" notes.md
          cat notes.md
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        run: |
          set -eu
          gh release create "$TAG" --title "Aph $VER" --notes-file notes.md \
            release/aph-x86_64.AppImage release/aph-x86_64.flatpak \
            release/aph-win64-portable.zip release/Aph-Setup-*.exe release/aph-payload-*.zip release/version.json release/SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
